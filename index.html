<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
<section id="loginSection" style="display: block;">

    <h1>Job Portal</h1>

    <form id="loginForm">

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            placeholder="Enter Your Email"
          
        >

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            placeholder="Enter Your Password"
          
        >

        <label for="userType">User Type:</label>

        <select id="userType" required>
            <option value="">Select User Type</option>
            <option value="employer">Employer</option>
            <option value="jobSeeker">Job Seeker</option>
        </select>

        <button id="submit" type="button">Login</button>

    </form>

</section>
    <section id="employerDashboard" style="display: none;">
      <h1>Employer Dashoboard</h1>
      <button id="createJobBtn">Create Job</button>
      <h2>My Jobs</h2>
      <div id="jobContainer"></div>
    </section>
      <section id="createJobSection" style="display: none;">

        <h1>Create Job</h1>

        <form id="jobForm">

            <label for="jobTitle">Job Title</label>
            <input 
                type="text" 
                id="jobTitle" 
                placeholder="Enter job title"
                
            >

            <label for="companyName">Company Name</label>
            <input 
                type="text" 
                id="companyName" 
                placeholder="Enter company name"
                
            >

            <label for="jobDescription">Job Description</label>
            <textarea 
                id="jobDescription" 
                placeholder="Enter job description"
                
            ></textarea>

            <label for="location">Location</label>
            <input 
                type="text" 
                id="location" 
                placeholder="Enter location"
                
            >

            <label for="salary">Salary</label>
            <input 
                type="text" 
                id="salary" 
                placeholder="Enter salary"
                
            >

            <label for="jobType">Job Type</label>

            <select id="jobType" required >
                <option value="">Select Job Type</option>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Remote">Remote</option>
            </select>

            <button id="saveJobBtn" type="button">Save Job</button>

        </form>

    </section>
    <script src="script.js"></script>
  </body>
</html>
